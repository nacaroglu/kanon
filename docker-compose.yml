services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    environment:
      KANON_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      KANON_LOG_LEVEL: ${KANON_LOG_LEVEL:-INFO}
      KANON_PROCEDURE_REPO_PATH: /data/procedures
      KANON_LLM_BASE_URL: ${KANON_LLM_BASE_URL:-}
      KANON_LLM_API_KEY: ${KANON_LLM_API_KEY:-}
      KANON_LLM_MODEL: ${KANON_LLM_MODEL:-}
    volumes:
      # The approved procedure repository, mounted read-only. Create the sample one with
      # scripts/make-sample-repo.sh ./procedure-repo, or point the host path at your own.
      - ${KANON_PROCEDURE_REPO_HOST_PATH:-./procedure-repo}:/data/procedures:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
