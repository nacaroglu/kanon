name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kanon
          POSTGRES_PASSWORD: kanon
          POSTGRES_DB: kanon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanon -d kanon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KANON_TEST_DATABASE_URL: postgresql://kanon:kanon@localhost:5432/kanon_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest
